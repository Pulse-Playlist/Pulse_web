name: Daily K-Pop & Band BPM Crawler

on:
  schedule:
    # Runs every day at 04:00 AM KST (19:00 UTC previous day)
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode to run (daily or seed)"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - seed
          - test

jobs:
  crawl-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt

      - name: Install system audio decoders (FFmpeg & libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r crawler/requirements.txt

      - name: Run PULSE BPM Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          python3 crawler/pipeline.py --mode "$MODE"

      - name: Commit updated songs.json snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crawler/data/songs.json || true
          git diff --staged --quiet || git commit -m "chore(data): update BPM database snapshot"
          git push || true
